name: build-ipa
on:
  push:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: echo "actions ok"
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned — Sideloadly signs it)
        run: |
          xcodebuild -project Squeeze.xcodeproj -scheme Squeeze -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 80
          test -d build/Build/Products/Release-iphoneos/Squeeze.app
      - name: Package IPA
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/Squeeze.app Payload/
          zip -qry VideoSqueeze.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VideoSqueeze-ipa
          path: VideoSqueeze.ipa
