name: Squeeze
options:
  bundleIdPrefix: com.squeeze
  deploymentTarget:
    iOS: "16.0"
targets:
  Squeeze:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: ضاغط الفيديو
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts:
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
        NSPhotoLibraryUsageDescription: يحتاج التطبيق الوصول إلى الصور ليجد الفيديوهات الكبيرة ويضغطها مع الحفاظ على تاريخها وموقعها.
        NSPhotoLibraryAddUsageDescription: لحفظ النسخة المضغوطة من الفيديو في مكتبة الصور.
        UIBackgroundModes: [processing, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.squeeze.video.ios.compress]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.squeeze.video.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_LANGUAGE: ar
